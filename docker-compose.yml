services:
  postgres:
    image: postgres:17-alpine
    container_name: novel-platform-postgres
    environment:
      POSTGRES_DB: novel_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - novel-platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novel_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  novel-platform-postgres-data: